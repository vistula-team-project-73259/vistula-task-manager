<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Contribution</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #eef2ff;
      color: #172554;
    }

    main {
      width: min(34rem, calc(100% - 2rem));
      padding: 2rem;
      border: 1px solid #c7d2fe;
      border-radius: 1rem;
      background: white;
      box-shadow: 0 1rem 3rem rgb(30 64 175 / 12%);
      text-align: center;
    }

    button,
    a {
      display: inline-block;
      margin: 0.5rem;
      padding: 0.75rem 1rem;
      border-radius: 0.6rem;
      font: inherit;
    }

    button {
      border: 0;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    a {
      color: #1d4ed8;
    }

    #contributor-student-id {
      min-height: 1.5rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Team Contribution</h1>
    <p>This page was contributed by another Vistula student.</p>
    <button id="load-contributor" type="button">Show Contributor</button>
    <p id="contributor-student-id" aria-live="polite"></p>
    <a href="index.html">Back to Task Manager</a>
  </main>

  <script>
    const button = document.querySelector("#load-contributor");
    const output = document.querySelector("#contributor-student-id");

    button.addEventListener("click", async () => {
      button.disabled = true;
      output.textContent = "Loading contributor...";

      try {
        const response = await fetch("contribution.json", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }

        const data = await response.json();
        if (!data.contributorStudentId) {
          throw new Error("The contributor student ID is missing.");
        }

        output.textContent = `Contributor Student ID: ${data.contributorStudentId}`;
      } catch (error) {
        output.textContent = `Unable to load contributor: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
